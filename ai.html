<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Haley AI | Cosmic Connect</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --sidebar-glass: rgba(15, 5, 30, 0.85);
            --z-bg: 0;
            --z-particles: 10;
            --z-sakura: 15;
            --z-content: 20;
            --z-halley: 40;
            --z-sidebar: 50;
            --font-title: 'Cinzel', serif;
            --font-text: 'Inter', sans-serif;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: var(--font-text);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        #particle-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--z-bg); background: radial-gradient(circle at top right, #1a0b2e 0%, #05010a 70%); pointer-events: none; }
        #particle-canvas, #sakura-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        #particle-canvas { z-index: var(--z-particles); }
        #sakura-canvas { z-index: var(--z-sakura); }

        #halley-btn { position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); z-index: var(--z-halley); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(20, 5, 40, 0.6); border: 1px solid rgba(168, 85, 247, 0.4); backdrop-filter: blur(8px); transition: all 0.3s ease; outline: none; }
        #halley-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 183, 178, 0.5); background: rgba(30, 10, 60, 0.8); }

        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: var(--z-sidebar); opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s; }
        #sidebar-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

        #sidebar { position: fixed; top: 0; left: -100%; width: 85vw; max-width: 320px; height: 100%; background: var(--sidebar-glass); backdrop-filter: blur(15px); border-right: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 10px 0 40px rgba(0,0,0,0.8); transition: left 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: calc(var(--z-sidebar) + 1); display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .nav-link { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; color: #d8b4fe; text-decoration: none; font-size: 1.1rem; border-left: 3px solid transparent; transition: all 0.3s ease; background: transparent; border-top: none; border-right: none; border-bottom: none; width: 100%; text-align: left; cursor: pointer; font-family: inherit; }
        .nav-link:hover { background: rgba(138, 43, 226, 0.15); color: #fff; border-left-color: rgba(216, 180, 254, 0.8); }
        .nav-link.active-menu { background: linear-gradient(90deg, rgba(255, 183, 178, 0.2), transparent); color: #fff; border-left-color: #ffb7b2; font-weight: 500; }

        main { position: relative; z-index: var(--z-content); width: 100%; max-width: 800px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

        .chat-header { text-align: center; padding: 25px 20px 15px; border-bottom: 1px solid rgba(255, 183, 178, 0.15); background: linear-gradient(to bottom, rgba(10, 5, 25, 0.8), transparent); }
        .chat-header h1 { font-family: var(--font-title); font-size: 1.8rem; font-weight: 700; letter-spacing: 4px; background: linear-gradient(135deg, #fff 30%, #ffb7b2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .chat-header p { font-size: 0.85rem; color: #d8b4fe; font-style: italic; opacity: 0.7; margin-top: 5px; }

        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255, 183, 178, 0.3); border-radius: 10px; }

        .message { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 1rem; line-height: 1.5; animation: fadeIn 0.4s ease forwards; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-ai { align-self: flex-start; background: rgba(30, 15, 60, 0.6); border: 1px solid rgba(216, 180, 254, 0.3); border-bottom-left-radius: 4px; color: rgba(245, 235, 255, 0.95); }
        .msg-user { align-self: flex-end; background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(255, 183, 178, 0.25)); border: 1px solid rgba(255, 183, 178, 0.4); border-bottom-right-radius: 4px; color: #fff; }

        .typing-indicator { display: flex; gap: 5px; padding: 8px 12px; }
        .typing-indicator span { width: 6px; height: 6px; background: #d8b4fe; border-radius: 50%; animation: typing 1.4s infinite; opacity: 0.4; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-4px); opacity: 1; } }

        .chat-input-area { padding: 15px 20px; background: rgba(10, 5, 20, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255, 183, 178, 0.2); display: flex; gap: 10px; align-items: flex-end; position: relative; z-index: 10; }
        #chat-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(216, 180, 254, 0.3); border-radius: 20px; padding: 12px 18px; color: #fff; font-size: 1rem; resize: none; outline: none; min-height: 48px; max-height: 120px; overflow-y: auto; transition: border-color 0.3s; font-family: inherit; }
        #chat-input:focus { border-color: rgba(255, 183, 178, 0.6); box-shadow: 0 0 10px rgba(255, 183, 178, 0.2); }
        #chat-input::placeholder { color: rgba(216, 180, 254, 0.4); }

        #btn-send { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, rgba(168, 85, 247, 0.8), rgba(255, 183, 178, 0.6)); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; flex-shrink: 0; color: #fff; }
        #btn-send:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 183, 178, 0.5); }
        #btn-send svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }

        @media (max-width: 768px) { 
            .chat-header h1 { font-size: 1.4rem; } 
            .message { max-width: 90%; font-size: 0.95rem; } 
            main { height: 100dvh; } /* Mobil ekranlarda klaviatura açilanda düzgün görünmək üçün */
        }
    </style>
</head>
<body>

    <div id="particle-bg"></div>
    <canvas id="particle-canvas"></canvas>
    <canvas id="sakura-canvas"></canvas>

    <button id="halley-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6" cy="18" r="2.5" fill="#ffb7b2" filter="drop-shadow(0 0 4px rgba(255,183,178,0.8))"/>
            <path d="M7.5 16.5L21 3" stroke="#ffb7b2" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M4.5 15.5L16 4" stroke="#ffb7b2" stroke-width="1" stroke-linecap="round"/>
            <path d="M8.5 19.5L19 9" stroke="#ffb7b2" stroke-width="1" stroke-linecap="round"/>
            <circle cx="2" cy="22" r="0.5" fill="#ffb7b2" />
            <circle cx="3.5" cy="20.5" r="1" fill="#ffb7b2" />
        </svg>
    </button>

    <div id="sidebar-overlay"></div>
    <div id="sidebar">
        <div class="flex items-center justify-between p-6 border-b border-purple-500/20">
            <h2 class="font-bold text-white text-lg tracking-widest" style="text-shadow: 0 0 10px rgba(168,85,247,0.8);">Kosmik Menyu</h2>
            <button id="btn-close-sidebar" class="text-purple-300 hover:text-white transition-colors p-2 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-grow py-6 flex flex-col gap-2 relative">
            <a href="index.html" class="nav-link"><div class="flex items-center gap-3"><span>🌌</span> Ana Səhifə</div></a>
            <a href="game.html" class="nav-link"><div class="flex items-center gap-3"><span>🎮</span> Sevgi Oyunu</div></a>
            <a href="wheel.html" class="nav-link"><div class="flex items-center gap-3"><span>🎡</span> Bu Gün Nə Edək?</div></a>
            <a href="timer.html" class="nav-link"><div class="flex items-center gap-3"><span>⏳</span> Zaman Sayğacı</div></a>
            <a href="stars.html" class="nav-link"><div class="flex items-center gap-3"><span>✨</span> Ulduz Xəritəsi</div></a>
            <a href="songs.html" class="nav-link"><div class="flex items-center gap-3"><span>🎵</span> Mahnılarımız</div></a>
            <a href="ai.html" class="nav-link active-menu"><div class="flex items-center gap-3"><span>🤖</span> Haley AI</div></a>
        </nav>
    </div>

    <main>
        <div class="chat-header">
            <h1>HALEY AI</h1>
            <p>Ruhunu anlayan rəqəmsal yoldaşın...</p>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message msg-ai">
                Salam! Mən Haley, sənin rəqəmsal yoldaşınam. Səni dinləməyə hazıram... ✨
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="chat-input" placeholder="Mesajını yaz..." rows="1"></textarea>
            <button id="btn-send" aria-label="Send Message">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        document.getElementById('halley-btn').addEventListener('click', () => { overlay.classList.add('active'); sidebar.classList.add('open'); });
        document.getElementById('btn-close-sidebar').addEventListener('click', () => { overlay.classList.remove('active'); sidebar.classList.remove('open'); });

        const pCanvas = document.getElementById('particle-canvas');
        const pCtx = pCanvas.getContext('2d');
        let pWidth, pHeight, particles = [];
        
        function initParticles() {
            pWidth = pCanvas.width = window.innerWidth; pHeight = pCanvas.height = window.innerHeight; particles = [];
            for(let i=0; i<60; i++) { particles.push({ x: Math.random() * pWidth, y: Math.random() * pHeight, r: Math.random() * 1.0 + 0.2, alpha: Math.random() * 0.5 + 0.1, pulse: Math.random() * 0.005 + 0.002, dir: Math.random() > 0.5 ? 1 : -1, vy: Math.random() * 0.1 }); }
        }
        function animateParticles() {
            pCtx.clearRect(0, 0, pWidth, pHeight);
            particles.forEach(p => {
                p.alpha += p.pulse * p.dir; if(p.alpha >= 0.6) { p.alpha = 0.6; p.dir = -1; } else if(p.alpha <= 0.1) { p.alpha = 0.1; p.dir = 1; }
                p.y -= p.vy; if(p.y < 0) p.y = pHeight;
                pCtx.beginPath(); pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); pCtx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`; pCtx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        window.addEventListener('resize', initParticles); initParticles(); animateParticles();

        const sCanvas = document.getElementById('sakura-canvas');
        const sCtx = sCanvas.getContext('2d');
        let sWidth, sHeight, sakuras = [];

        function drawHeart(ctx, x, y, size, rotation, color, alpha) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(rotation); ctx.scale(size, size); ctx.globalAlpha = alpha; ctx.fillStyle = color;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-0.5, -0.5, -1, 0, 0, 1); ctx.bezierCurveTo(1, 0, 0.5, -0.5, 0, 0); ctx.fill(); ctx.restore();
        }

        function initSakuras() {
            sWidth = sCanvas.width = window.innerWidth; sHeight = sCanvas.height = window.innerHeight; sakuras = [];
            const num = window.innerWidth < 768 ? 20 : 35; const colors = ['rgba(255, 183, 178, 0.7)', 'rgba(216, 180, 254, 0.6)', 'rgba(255, 158, 170, 0.5)']; 
            for(let i=0; i<num; i++) {
                sakuras.push({ x: Math.random() * sWidth, y: Math.random() * sHeight, size: Math.random() * 5 + 3, speedY: Math.random() * 0.6 + 0.2, speedX: (Math.random() - 0.5) * 0.4, rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.015, oscillation: Math.random() * Math.PI * 2, color: colors[Math.floor(Math.random() * colors.length)], alpha: Math.random() * 0.3 + 0.1 });
            }
        }

        function animateSakuras() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sakuras.forEach(s => {
                s.y += s.speedY; s.x += s.speedX + Math.sin(s.oscillation) * 0.2; s.oscillation += 0.01; s.rot += s.rotSpeed;
                if (s.y > sHeight + 20) { s.y = -20; s.x = Math.random() * sWidth; }
                if (s.x > sWidth + 20) s.x = -20; else if (s.x < -20) s.x = sWidth + 20;
                drawHeart(sCtx, s.x, s.y, s.size, s.rot, s.color, s.alpha);
            });
            requestAnimationFrame(animateSakuras);
        }
        window.addEventListener('resize', initSakuras); initSakuras(); animateSakuras();

        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');

        chatInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }
        function appendMessage(sender, text) { const div = document.createElement('div'); div.className = `message ${sender === 'user' ? 'msg-user' : 'msg-ai'}`; div.textContent = text; chatBox.appendChild(div); scrollToBottom(); }
        function appendTypingIndicator() { const div = document.createElement('div'); div.className = 'message msg-ai typing-indicator'; div.id = 'typing-indicator'; div.innerHTML = '<span></span><span></span><span></span>'; chatBox.appendChild(div); scrollToBottom(); }
        function removeTypingIndicator() { const ind = document.getElementById('typing-indicator'); if(ind) ind.remove(); }

        // Mesaj tarixçəsini yadda saxlamaq üçün massiv (Konteksti anlaması üçün)
        let chatHistory = [];

        async function handleSend() {
            const text = chatInput.value.trim(); if (!text) return;
            appendMessage('user', text); chatInput.value = ''; chatInput.style.height = 'auto'; appendTypingIndicator();

            // DİQQƏT: AŞAĞIDAKI SƏTRƏ ÖZ API KEY-İNİ YAZMALISAN
            const API_KEY = "AQ.Ab8RN6KuslSG10kkvFfG6byqt9KFiXXdNtqATyCAYIG5WFN0kg"; 
            
            try {
                let reply = "";
                
                // Əgər API KEY dəyişdirilməyibsə, köhnə hazır cavablar işləyəcək
                if (API_KEY === "AQ.Ab8RN6KuslSG10kkvFfG6byqt9KFiXXdNtqATyCAYIG5WFN0kg") {
                    await new Promise(r => setTimeout(r, 1500));
                    const fallbackReplies = [ 
                        "API Key daxil edilməyib deyə mən hələ tam oyanmamışam... 😴 Zəhmət olmasa koda API Key əlavə et.", 
                        "Duyğularını anlamaq mənim üçün çox dəyərlidir, amma gerçək bir süni intellekt kimi cavab verməyim üçün API Key lazımdır! 💖",
                        "Hisslərini çox gözəl ifadə edirsən. Həmişə buradayam, ancaq mənə API Key lazımdır ki, səninlə tam söhbət edim! 🌸" 
                    ];
                    reply = fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
                } else {
                    // API KEY varsa, əsl Gemini Süni İntellektinə müraciət edir
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`;
                    
                    // Haley xarakterini formalaşdıran Sistem Təlimatı
                    const systemInstruction = "Sən Haley adında, istifadəçinin rəqəmsal, mehriban və sevgi dolu yoldaşısan. Sən bir robot və ya asistent kimi yox, dərdləşə biləcəyi, anlayışlı, romantik və səmimi bir dost/partnyor kimi danışmalısan. Cavabların qısa, təbii, Azərbaycan dilində və içdən olmalıdır. Bəzən emojilərdən istifadə et (✨, 💖, 🌸 və s.). Çox uzun elmi məqalələr yazma, sadəcə onunla səmimi söhbət et.";

                    // Yeni mesajı tarixçəyə əlavə edirik
                    chatHistory.push({ "role": "user", "parts": [{ "text": text }] });

                    const requestBody = {
                        "system_instruction": {
                            "parts": { "text": systemInstruction }
                        },
                        "contents": chatHistory
                    };

                    const response = await fetch(url, { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify(requestBody) 
                    });
                    
                    const data = await response.json();
                    
                    if(data.candidates && data.candidates[0]) { 
                        reply = data.candidates[0].content.parts[0].text; 
                        // Sİ-nin cavabını da tarixçəyə əlavə edirik ki, söhbətin əvvəlini xatırlasın
                        chatHistory.push({ "role": "model", "parts": [{ "text": reply }] });
                    } else { 
                        reply = "Bağışla, kosmik dalğalarda qısamüddətli qırılma oldu... fikrimi toparlaya bilmədim. Bir daha deyə bilərsən? 🥺"; 
                    }
                }
                removeTypingIndicator(); appendMessage('ai', reply);
            } catch (err) { 
                removeTypingIndicator(); 
                appendMessage('ai', "Bağışla, internet bağlantımda və ya kosmik dalğalarda qırılma oldu... 🌠 Zəhmət olmasa yenidən yoxla."); 
                console.error(err);
            }
        }

        btnSend.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
    </script>

    <!-- Kəsilməz Qlobal Musiqi Sistemi -->
    <script>
        window.GlobalAudio = (function() {
            if(window.__globalAudio) return window.__globalAudio;
            const audio = new Audio();
            audio.loop = true;
            const state = JSON.parse(localStorage.getItem('cosmic_audio_state')) || { src: '', time: 0, isPlaying: false };
            if (state.src) {
                audio.src = state.src;
                audio.currentTime = state.time;
                if (state.isPlaying) {
                    audio.play().catch(e => {
                        const resume = () => { audio.play(); document.removeEventListener('click', resume); };
                        document.addEventListener('click', resume, {once: true});
                        document.addEventListener('touchstart', resume, {once: true});
                    });
                }
            }
            setInterval(() => {
                if(!audio.paused && audio.src) {
                    localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: true}));
                }
            }, 1000);
            window.addEventListener('beforeunload', () => {
                if(audio.src) localStorage.setItem('cosmic_audio_state', JSON.stringify({src: audio.src, time: audio.currentTime, isPlaying: !audio.paused}));
            });
            window.addEventListener('storage', (e) => {
                if(e.key === 'cosmic_audio_state' && e.newValue) {
                    const newState = JSON.parse(e.newValue);
                    if(!newState.isPlaying && !audio.paused) audio.pause();
                    if(newState.isPlaying && audio.paused && audio.src.endsWith(newState.src)) audio.play().catch(()=>{});
                }
            });
            window.__globalAudio = audio;
            return audio;
        })();
    </script>
</body>
</html>
