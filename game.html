<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sevgi Oyunu</title>
    <style>
        :root {
            --bg-base: #040108;
            --accent: #9d72ff;
            --accent-glow: rgba(157, 114, 255, 0.6);
            --text-main: #eaddff;
            --text-muted: rgba(234, 221, 255, 0.5);
            --btn-bg: rgba(30, 10, 60, 0.7);
            --btn-border: rgba(157, 114, 255, 0.3);
            --safe-top: env(safe-area-inset-top, 1rem);
            --safe-bottom: env(safe-area-inset-bottom, 1rem);
            --safe-left: env(safe-area-inset-left, 1rem);
            --safe-right: env(safe-area-inset-right, 1rem);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: radial-gradient(circle at center, rgba(15,5,30,0.85) 0%, var(--bg-base) 100%);
            backdrop-filter: blur(4px);
            transition: opacity 0.8s ease, visibility 0.8s;
            pointer-events: auto;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important;
        }

        h1.main-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 200;
            letter-spacing: clamp(0.2rem, 2vw, 0.8rem);
            margin-bottom: 0.5rem;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 25px var(--accent-glow);
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 0.2rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            text-align: center;
        }

        .hud-container {
            position: absolute;
            top: max(1.5rem, var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            width: max-content;
        }

        .level-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            backdrop-filter: blur(2px);
        }

        .boss-badge {
            color: #ff4d85;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 77, 133, 0.6);
            animation: pulse-boss 2s infinite alternate;
        }

        .hud-text {
            font-size: 1rem;
            letter-spacing: 0.3rem;
            color: var(--text-muted);
        }

        button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 1rem 2.5rem;
            font-size: 1rem;
            letter-spacing: 0.15rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        button:hover:not(:disabled), button:active:not(:disabled) {
            background: rgba(82, 38, 137, 0.9);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }

        #btn-halley {
            position: absolute;
            top: max(1rem, var(--safe-top));
            left: max(1rem, var(--safe-left));
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            z-index: 100;
            background: rgba(15, 5, 30, 0.8);
            border: 1px solid var(--btn-border);
        }

        #btn-halley svg {
            width: 22px;
            height: 22px;
            fill: var(--text-main);
        }

        .btn-back {
            position: absolute;
            top: max(1rem, var(--safe-top));
            left: calc(max(1rem, var(--safe-left)) + 60px);
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            letter-spacing: 0.1rem;
            background: transparent;
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: none;
            z-index: 100;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 25%;
            min-width: 280px;
            height: 100vh;
            background: rgba(15, 5, 35, 0.95);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(157, 114, 255, 0.3);
            z-index: 1000;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: max(2rem, var(--safe-top)) 1.5rem 2rem 1.5rem;
            pointer-events: auto;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }

        @media (max-width: 768px) {
            #sidebar { width: 85%; }
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 2rem;
        }

        #btn-sidebar-close {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 2rem;
            padding: 0.5rem;
            line-height: 1;
            color: var(--text-muted);
            width: auto;
            border-radius: 0;
        }
        #btn-sidebar-close:hover {
            color: var(--text-main);
            transform: scale(1.1);
            background: transparent;
        }

        /* Naviqasiya Menyu Tərtibatı */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 0.1rem;
            border-radius: 12px;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .sidebar-nav a:hover {
            color: var(--text-main);
            background: rgba(157, 114, 255, 0.1);
        }

        .sidebar-nav a.active {
            color: var(--text-main);
            background: rgba(157, 114, 255, 0.2);
            border-color: rgba(157, 114, 255, 0.4);
            box-shadow: 0 0 15px rgba(157, 114, 255, 0.2);
        }

        .levels-container {
            width: 90%;
            max-width: 800px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            margin-bottom: 2rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        
        .levels-container::-webkit-scrollbar {
            width: 6px;
        }
        .levels-container::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 10px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 1rem;
        }

        .level-card {
            padding: 0.8rem 0.2rem;
            font-size: 1rem;
            border-radius: 8px;
            text-align: center;
            background: rgba(30, 10, 60, 0.5);
            border: 1px solid rgba(157, 114, 255, 0.2);
            box-shadow: none;
            letter-spacing: normal;
        }

        .level-card.locked {
            opacity: 0.3;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            border-color: transparent;
        }

        .level-card.boss {
            border-color: #ff4d85;
            color: #ffdddd;
            background: rgba(100, 10, 40, 0.4);
        }
        
        .level-card.boss:hover {
            border-color: #ff4d85;
            box-shadow: 0 0 15px rgba(255, 77, 133, 0.6);
        }

        .level-card.current {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .action-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .action-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 1rem;
        }

        .win-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            animation: pulse-win 2s infinite alternate;
            text-align: center;
        }

        @keyframes pulse-boss {
            from { opacity: 0.7; text-shadow: 0 0 10px rgba(255, 77, 133, 0.4); }
            to { opacity: 1; text-shadow: 0 0 25px rgba(255, 77, 133, 0.9); }
        }

        @keyframes pulse-win {
            from { text-shadow: 0 0 20px rgba(157, 114, 255, 0.6); }
            to { text-shadow: 0 0 40px rgba(255, 255, 255, 1); }
        }
        
        #debug-overlay {
            position: absolute;
            bottom: max(1rem, var(--safe-bottom));
            left: max(1rem, var(--safe-left));
            color: lime;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 999;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <canvas id="offscreen-canvas" style="display:none;"></canvas>

    <div id="debug-overlay"></div>

    <!-- Halley Button (Persistent) -->
    <button id="btn-halley" aria-label="Open Navigation">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5C12 2.5 14 8 19 10C19 10 14 12 12 17.5C12 17.5 10 12 5 10C5 10 10 8 12 2.5Z"/>
            <circle cx="18" cy="4" r="1.5"/>
            <circle cx="21" cy="15" r="1"/>
            <circle cx="4" cy="18" r="1.5"/>

    </button>

    <!-- Sidebar Navigation -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button id="btn-sidebar-close" aria-label="Close Navigation">&times;</button>
        </div>
        <div class="sidebar-nav">
            <a href="index.html">💓 Kosmik Ürək</a>
            <a href="game.html" class="active">🎮 Sevgi Oyunu</a>
            <a href="wheel.html">🎡 Bu Gün Nə Edək?</a>
            <a href="timer.html">⏳ Zaman Sayğacı</a>
            <a href="stars.html">✨ Ulduz Xəritəsi</a>

        </div>
    </div>

    <!-- Active Game HUD -->
    <div id="active-ui" class="ui-layer hidden">
        <button id="btn-back" class="btn-back" aria-label="Go Back to Menu">← BACK</button>
        
        <div class="hud-container">
            <div class="level-info">
                <div id="hud-boss-badge" class="boss-badge hidden">BOSS LEVEL</div>

    <!-- Main Menu -->
    <div id="screen-menu" class="screen">
        <h1 class="main-title">Sevgi Oyunu</h1>
        <div id="menu-subtitle" class="subtitle">LEVEL 1 / 100</div>
        <div class="action-column">
            <button id="btn-start">START</button>
            <button id="btn-levels">LEVELS</button>
        </div>
    </div>

    <!-- Level Selection Screen -->
    <div id="screen-levels" class="screen hidden">
        <h1 class="main-title" style="font-size: clamp(1.5rem, 4vw, 3rem);">SELECT LEVEL</h1>
        <div class="levels-container">
            <div class="levels-grid" id="levels-grid">
                <!-- Dynamically populated -->
            </div>
        </div>
        <button id="btn-levels-back">← BACK TO MENU</button>
    </div>

    <!-- Win Screen -->
    <div id="screen-win" class="screen hidden">
        <h2 class="win-title">YOU ARE WIN</h2>
        <div class="action-row">
            <button id="btn-win-menu">MAIN MENU</button>
            <button id="btn-next">NEXT LEVEL</button>
        </div>
    </div>

    <!-- Final 100 Screen -->
    <div id="screen-final" class="screen hidden">
        <h2 class="win-title" style="font-size: clamp(2rem, 5vw, 4rem); line-height: 1.3;">YOU COMPLETED<br>ALL 100 LEVELS</h2>
        <div class="subtitle" style="margin-bottom: 2rem;">The universe is full of love.</div>
        <button id="btn-final-menu">MAIN MENU</button>
    </div>

    <script>
        const DEBUG = false;
        if (DEBUG) document.getElementById('debug-overlay').style.display = 'block';

        // Robust Quaternion for 360 degree 3D rotation
        class Quat {
            constructor(w = 1, x = 0, y = 0, z = 0) {
                this.w = w; this.x = x; this.y = y; this.z = z;
            }
            clone() { return new Quat(this.w, this.x, this.y, this.z); }
            multiply(q) {
                const w = this.w * q.w - this.x * q.x - this.y * q.y - this.z * q.z;
                const x = this.w * q.x + this.x * q.w + this.y * q.z - this.z * q.y;
                const y = this.w * q.y - this.x * q.z + this.y * q.w + this.z * q.x;
                const z = this.w * q.z + this.x * q.y - this.y * q.x + this.z * q.w;
                this.w = w; this.x = x; this.y = y; this.z = z;
                return this;
            }
            normalize() {
                let len = Math.sqrt(this.w*this.w + this.x*this.x + this.y*this.y + this.z*this.z);
                if (len === 0) { this.w = 1; this.x = this.y = this.z = 0; }
                else { this.w /= len; this.x /= len; this.y /= len; this.z /= len; }
                return this;
            }
            invert() {
                this.x = -this.x; this.y = -this.y; this.z = -this.z;
                return this.normalize();
            }
            slerp(q, t) {
                let cosHalfTheta = this.w * q.w + this.x * q.x + this.y * q.y + this.z * q.z;
                let qm = q.clone();
                if (cosHalfTheta < 0) {
                    qm.w = -qm.w; qm.x = -qm.x; qm.y = -qm.y; qm.z = -qm.z;
                    cosHalfTheta = -cosHalfTheta;
                }
                if (Math.abs(cosHalfTheta) >= 1.0) return this.clone();
                
                const halfTheta = Math.acos(cosHalfTheta);
                const sinHalfTheta = Math.sqrt(1.0 - cosHalfTheta * cosHalfTheta);
                
                if (Math.abs(sinHalfTheta) < 0.001) {
                    return new Quat(
                        this.w * 0.5 + qm.w * 0.5,
                        this.x * 0.5 + qm.x * 0.5,
                        this.y * 0.5 + qm.y * 0.5,
                        this.z * 0.5 + qm.z * 0.5
                    ).normalize();
                }
                const ratioA = Math.sin((1 - t) * halfTheta) / sinHalfTheta;
                const ratioB = Math.sin(t * halfTheta) / sinHalfTheta;
                return new Quat(
                    this.w * ratioA + qm.w * ratioB,
                    this.x * ratioA + qm.x * ratioB,
                    this.y * ratioA + qm.y * ratioB,
                    this.z * ratioA + qm.z * ratioB
                );
            }
            static fromAxisAngle(axis, angle) {
                const halfAngle = angle / 2;
                const s = Math.sin(halfAngle);
                return new Quat(Math.cos(halfAngle), axis[0] * s, axis[1] * s, axis[2] * s);
            }
            static dot(q1, q2) {
                return q1.w*q2.w + q1.x*q2.x + q1.y*q2.y + q1.z*q2.z;
            }
            toMatrix() {
                const w = this.w, x = this.x, y = this.y, z = this.z;
                return [
                    1 - 2*y*y - 2*z*z, 2*x*y - 2*w*z, 2*x*z + 2*w*y,
                    2*x*y + 2*w*z, 1 - 2*x*x - 2*z*z, 2*y*z - 2*w*x,
                    2*x*z - 2*w*y, 2*y*z + 2*w*x, 1 - 2*x*x - 2*y*y
                ];
            }
        }

        function rotateVec3(mat, x, y, z) {
            return {
                x: mat[0]*x + mat[1]*y + mat[2]*z,
                y: mat[3]*x + mat[4]*y + mat[5]*z,
                z: mat[6]*x + mat[7]*y + mat[8]*z
            };
        }

        function PRNG(seed) {
            return function() {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        const RAW_WORDS = [
            "LOVE","AŞK","AMOUR","LIEBE","AMORE","SOUL","TRUE","RÜYA","KISS","PURE",
            "KALP","MIND","HOPE","LIFE","GIFT","BOND","WISH","DEAR","LÜTFEN","STAR",
            "SEVGİ","HEART","DREAM","TRUST","SMILE","SWEET","CŒUR","STERN","DOLCE","ŞİRİN",
            "MAGIC","FLAME","SHINE","PEACE","BLISS","GRACE","CHARM","MELEK","ANGEL","CUORE",
            "PASSION","TENDRE","HAYATIM","SEVDAM","DESIRE","ETERNAL","DESTINY","FOREVER","PROMISE","ROMANCE",
            "HARMONY","JOURNEY","MIRACLE","BELOVED","ADORING","INFINITE","CHERISH","DEVOTION","BEAUTY","EUPHORIA",
            "AFFECTION","SOULMATE","SONSUZLUK","FEELINGS","ELEGANCE","MAGNIFIQUE","LUMINOUS","SYMPHONY","MERAVIGLIA","MOONLIGHT",
            "STARLIGHT","ENCHANTED","WHISPERS","TREASURE","GLAMOUR","SERENITY","RADIANCE","PARADISE","UNIVERSE","LÜTFÜ",
            "FASCINATION","WONDERLAND","TUTKULU","MARVELLOUS","PERFECTION","BREATHTAKING","INVINCIBLE","PASSIONATE","INCREDIBLE","SCHMETTERLING",
            "ILLUMINATION","TRANQUILITY","INEFFABLE","ETERNITY","AMAZEMENT","AFFECTIONATE","ENTHRALLING","MAGNIFICENCE","UNFORGETTABLE","SEVDİYİM"
        ];

        const LEVELS = [];
        for (let i = 0; i < 100; i++) {
            const levelNum = i + 1;
            const isBoss = (levelNum % 10 === 0);
            const diff = i / 99; 
            const random = PRNG(2025 + i * 42); 
            
            const rx = (random() * Math.PI * 2) - Math.PI;
            const ry = (random() * Math.PI * 2) - Math.PI;
            const rz = (random() * Math.PI * 2) - Math.PI;
            
            const targetQ = Quat.fromAxisAngle([1,0,0], rx)
                .multiply(Quat.fromAxisAngle([0,1,0], ry))
                .multiply(Quat.fromAxisAngle([0,0,1], rz))
                .normalize();

            const bossMultiplier = isBoss ? 1.8 : 1.0;
            
            let tolerance = (0.28 - (diff * 0.15)) * (isBoss ? 0.8 : 1.0); 
            let baseNoise = Math.floor((300 + Math.pow(diff, 1.5) * 3000) * bossMultiplier); 
            let zDepth = Math.floor((150 + (diff * 250)) * (isBoss ? 1.4 : 1.0));
            let density = Math.max(1, (2.5 - (diff * 1.0)) * (isBoss ? 0.9 : 1.0)); 

            LEVELS.push({
                level: levelNum,
                word: RAW_WORDS[i] || "LOVE",
                isBoss: isBoss,
                targetRotation: targetQ,
                noiseCount: baseNoise,
                tolerance: Math.max(0.10, tolerance), 
                zDepth: zDepth,       
                pointDensity: density,
                seed: 2025 + i
            });
        }

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const offCanvas = document.getElementById('offscreen-canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        let width, height, centerX, centerY, dpr;
        let points = []; 
        let cameraZ = 800; 
        let isMobile = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            isMobile = width < 768;
            dpr = Math.min(window.devicePixelRatio || 1, 2); 
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function generatePointCloud(levelData) {
            points = [];
            const word = levelData.word;
            const random = PRNG(levelData.seed);
            
            let fontSize = 160;
            if (word.length > 5) fontSize = 120;
            if (word.length > 8) fontSize = 90;
            if (word.length > 11) fontSize = 70;

            offCanvas.width = 1200;
            offCanvas.height = 400;
            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.fillStyle = '#FFF';
            offCtx.font = `bold ${fontSize}px 'Inter', sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(word, offCanvas.width / 2, offCanvas.height / 2);

            const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const data = imgData.data;
            const step = Math.max(1, Math.floor(levelData.pointDensity));

            let rawWordPoints = [];
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

            for (let y = 0; y < offCanvas.height; y += step) {
                for (let x = 0; x < offCanvas.width; x += step) {
                    const idx = (y * offCanvas.width + x) * 4;
                    if (data[idx] > 128) { 
                        rawWordPoints.push({ x, y });
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            const wCenterX = (minX + maxX) / 2;
            const wCenterY = (minY + maxY) / 2;
            const invTargetQ = levelData.targetRotation.clone().invert();
            const invMat = invTargetQ.toMatrix();

            for (let i = 0; i < rawWordPoints.length; i++) {
                const p = rawWordPoints[i];
                let lx = p.x - wCenterX;
                let ly = p.y - wCenterY;
                let lz = (random() - 0.5) * levelData.zDepth;
                let worldPos = rotateVec3(invMat, lx, ly, lz);

                points.push({
                    x: worldPos.x, y: worldPos.y, z: worldPos.z,
                    isWord: true,
                    baseSize: 0.5 + random() * 1.5, 
                    motionPhase: random() * Math.PI * 2
                });
            }

            let actualNoiseCount = levelData.noiseCount;
            if (isMobile) actualNoiseCount = Math.min(actualNoiseCount, levelData.isBoss ? 2500 : 1800); 

            const spreadLimit = Math.max(maxX - minX, 400) * 2.0;
            const zSpreadLimit = levelData.zDepth * 3.0;

            for (let i = 0; i < actualNoiseCount; i++) {
                const cluster = random() > 0.5; 
                let rx, ry, rz;
                
                if (cluster && rawWordPoints.length > 0) {
                    const wp = rawWordPoints[Math.floor(random() * rawWordPoints.length)];
                    rx = wp.x - wCenterX + (random() - 0.5) * 120;
                    ry = wp.y - wCenterY + (random() - 0.5) * 120;
                    rz = (random() > 0.5 ? 1 : -1) * (random() * zSpreadLimit);
                    let wpWorld = rotateVec3(invMat, rx, ry, rz);
                    rx = wpWorld.x; ry = wpWorld.y; rz = wpWorld.z;
                } else {
                    rx = (random() - 0.5) * spreadLimit;
                    ry = (random() - 0.5) * spreadLimit;
                    rz = (random() - 0.5) * spreadLimit * 2.0;
                }

                points.push({
                    x: rx, y: ry, z: rz,
                    isWord: false,
                    baseSize: 0.5 + random() * 2.5,
                    motionPhase: random() * Math.PI * 2,
                    brightnessMod: random() 
                });
            }
        }

        function renderFrame(qCurrent, error, tolerance, time) {
            ctx.fillStyle = '#040108'; 
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';
            const mat = qCurrent.toMatrix();
            const fov = cameraZ;

            const effectWindow = tolerance * 2.0;
            let clarity = 0;
            if (error < effectWindow) {
                const normalized = Math.max(0, 1 - (error / effectWindow));
                clarity = Math.pow(normalized, 3);
            }

            let renderList = [];

            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const rotated = rotateVec3(mat, p.x, p.y, p.z);
                let rx = rotated.x + Math.sin(time * 0.001 + p.motionPhase) * 2;
                let ry = rotated.y + Math.cos(time * 0.001 + p.motionPhase) * 2;
                let rz = rotated.z;

                const scale = fov / (fov + rz);
                if (scale < 0) continue; 

                const screenX = centerX + rx * scale;
                const screenY = centerY + ry * scale;

                let alpha, size, r, g, b;

                if (p.isWord) {
                    alpha = Math.max(0.01, clarity); 
                    size = p.baseSize * scale * (1 + clarity);
                    r = Math.floor(100 + clarity * 155); 
                    g = Math.floor(50 + clarity * 205); 
                    b = 255; 
                } else {
                    alpha = Math.max(0.05, 0.4 * (1 - clarity * 0.8) * p.brightnessMod);
                    size = p.baseSize * scale;
                    r = 80; g = 30; b = 130; 
                }

                if (alpha > 1) alpha = 1;
                if (alpha < 0.01) continue;

                renderList.push({ x: screenX, y: screenY, z: rz, size: size, r, g, b, alpha });
            }

            renderList.sort((a, b) => b.z - a.z);

            for (let i = 0; i < renderList.length; i++) {
                const p = renderList[i];
                ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalCompositeOperation = 'source-over';
            return clarity; 
        }

        const GAME_STATES = { MENU: 0, ACTIVE: 1, WIN: 2, FINAL: 3, LEVELS: 4 };
        let currentState = GAME_STATES.MENU;
        
        let currentLevelIndex = parseInt(localStorage.getItem('loveGameCurrentLevel')) || 0;
        if (currentLevelIndex >= 100) currentLevelIndex = 99; 
        let activeLevelIndex = currentLevelIndex; 
        
        let activeLevel = null;
        let qCurrent = new Quat();
        let targetQuat = new Quat();
        
        let isDragging = false, isZDragging = false;
        let lastX, lastY, initialPinchAngle = null, baseZQuat = new Quat();

        let lastTime = performance.now();
        let winConfirmTimer = 0;
        let autoRotateTime = 0;

        const screenMenu = document.getElementById('screen-menu');
        const screenLevels = document.getElementById('screen-levels');
        const screenWin = document.getElementById('screen-win');
        const screenFinal = document.getElementById('screen-final');
        const activeUI = document.getElementById('active-ui');
        const debugOverlay = document.getElementById('debug-overlay');
        const sidebar = document.getElementById('sidebar');
        
        function updateMenuTexts() {
            document.getElementById('menu-subtitle').innerText = `LEVEL ${currentLevelIndex + 1} / 100`;
            document.getElementById('hud-level-text').innerText = `LEVEL ${activeLevelIndex + 1} / 100`;
            
            if ((activeLevelIndex + 1) % 10 === 0) {
                document.getElementById('hud-boss-badge').classList.remove('hidden');
            } else {
                document.getElementById('hud-boss-badge').classList.add('hidden');
            }
        }

        function setScreen(state) {
            currentState = state;
            screenMenu.classList.add('hidden');
            screenLevels.classList.add('hidden');
            screenWin.classList.add('hidden');
            screenFinal.classList.add('hidden');
            activeUI.classList.add('hidden');

            if (state === GAME_STATES.MENU) {
                updateMenuTexts();
                screenMenu.classList.remove('hidden');
                qCurrent = new Quat(); 
            } else if (state === GAME_STATES.LEVELS) {
                renderLevelsScreen();
                screenLevels.classList.remove('hidden');
            } else if (state === GAME_STATES.ACTIVE) {
                activeUI.classList.remove('hidden');
                updateMenuTexts();
            } else if (state === GAME_STATES.WIN) {
                screenWin.classList.remove('hidden');
            } else if (state === GAME_STATES.FINAL) {
                screenFinal.classList.remove('hidden');
            }
        }

        function renderLevelsScreen() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            const gameCompleted = localStorage.getItem('loveGameCompleted') === 'true';

            for (let i = 0; i < 100; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-card';
                
                const isUnlocked = gameCompleted || i <= currentLevelIndex;
                const isBoss = (i + 1) % 10 === 0;

                if (!isUnlocked) {
                    btn.classList.add('locked');
                    btn.innerHTML = `🔒 ${i + 1}`;
                    btn.disabled = true;
                } else if (isBoss) {
                    btn.classList.add('boss');
                    btn.innerHTML = `★ ${i + 1}`;
                } else {
                    btn.innerHTML = (i + 1).toString().padStart(2, '0');
                }

                if (i === currentLevelIndex && !gameCompleted) {
                    btn.classList.add('current');
                }

                if (isUnlocked) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startLevel(i);
                    });
                }
                grid.appendChild(btn);
            }
        }

        function startLevel(index) {
            if (index >= 100) {
                setScreen(GAME_STATES.FINAL);
                return;
            }
            
            activeLevelIndex = index;
            activeLevel = LEVELS[index];
            targetQuat = activeLevel.targetRotation.clone();
            generatePointCloud(activeLevel);

            const random = PRNG(Date.now());
            qCurrent = Quat.fromAxisAngle([random(), random(), random()].map(n=>n-0.5), random() * Math.PI * 2).normalize();
            
            winConfirmTimer = 0;
            setScreen(GAME_STATES.ACTIVE);
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }
        document.getElementById('btn-halley').addEventListener('click', toggleSidebar);
        document.getElementById('btn-sidebar-close').addEventListener('click', () => sidebar.classList.remove('open'));
        
        ['mousedown', 'touchstart', 'mousemove', 'touchmove'].forEach(evt => {
            sidebar.addEventListener(evt, e => e.stopPropagation(), {passive: false});
        });

        document.querySelectorAll('.screen button, .ui-layer button').forEach(btn => {
            btn.addEventListener('mousedown', e => e.stopPropagation());
            btn.addEventListener('touchstart', e => e.stopPropagation());
        });

        function handleDragDelta(dx, dy, isZ) {
            if (currentState !== GAME_STATES.ACTIVE) return;
            const sensitivity = 0.006;
            if (isZ) {
                const dQ = Quat.fromAxisAngle([0, 0, 1], -dy * sensitivity * 2);
                qCurrent = dQ.multiply(qCurrent).normalize();
            } else {
                const dY = Quat.fromAxisAngle([1, 0, 0], dy * sensitivity);
                const dX = Quat.fromAxisAngle([0, 1, 0], dx * sensitivity);
                qCurrent = dX.multiply(dY).multiply(qCurrent).normalize();
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if(e.button !== 0 && e.button !== 2) return;
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            isZDragging = e.shiftKey || e.button === 2;
        });
        window.addEventListener('mouseup', () => { isDragging = false; isZDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            if (e.shiftKey) isZDragging = true;
            else if (e.button !== 2 && !e.buttons) isDragging = false;
            handleDragDelta(dx, dy, isZDragging);
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault()); 

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                initialPinchAngle = null;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                initialPinchAngle = Math.atan2(dy, dx);
                baseZQuat = qCurrent.clone();
            }
        });
        
        window.addEventListener('touchend', () => { isDragging = false; initialPinchAngle = null; });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                handleDragDelta(dx, dy, false);
            } else if (e.touches.length === 2 && initialPinchAngle !== null) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const angle = Math.atan2(dy, dx);
                const dQ = Quat.fromAxisAngle([0, 0, 1], -(angle - initialPinchAngle));
                qCurrent = dQ.multiply(baseZQuat.clone()).normalize();
            }
        }, { passive: false });

        function gameLoop(currentTime) {
            const dt = Math.min(currentTime - lastTime, 50); 
            lastTime = currentTime;

            if (currentState === GAME_STATES.ACTIVE) {
                let dot = Quat.dot(qCurrent, targetQuat);
                dot = Math.max(-1, Math.min(1, Math.abs(dot))); 
                const error = 2 * Math.acos(dot);
                
                const winTolerance = activeLevel.tolerance;
                const holdTolerance = winTolerance * 1.20; 
                
                if (error <= winTolerance) {
                    winConfirmTimer += dt;
                } else if (winConfirmTimer > 0 && error <= holdTolerance) {
                    winConfirmTimer += dt; 
                } else {
                    winConfirmTimer = 0;   
                }

                if (winConfirmTimer > 0) {
                    qCurrent = qCurrent.slerp(targetQuat, 0.02);
                }

                let clarity = renderFrame(qCurrent, error, winTolerance, currentTime);

                if (DEBUG) {
                    debugOverlay.innerText = `Error: ${error.toFixed(3)}\nTol: ${winTolerance.toFixed(3)}\nClarity: ${clarity.toFixed(3)}\nTimer: ${(winConfirmTimer/1000).toFixed(2)}s`;
                }

                if (winConfirmTimer >= 2000) {
                    const gameCompleted = localStorage.getItem('loveGameCompleted') === 'true';
                    
                    if (activeLevelIndex === currentLevelIndex && !gameCompleted) {
                        currentLevelIndex++;
                        localStorage.setItem('loveGameCurrentLevel', currentLevelIndex);
                    }
                    
                    if (activeLevelIndex >= 99 || (gameCompleted && activeLevelIndex === 99)) {
                        localStorage.setItem('loveGameCompleted', 'true');
                        setScreen(GAME_STATES.FINAL);
                    } else {
                        setScreen(GAME_STATES.WIN);
                    }
                }

            } else {
                autoRotateTime += dt * 0.0005;
                if(points.length === 0) {
                     generatePointCloud({ word: "SEVGİ", noiseCount: 500, zDepth: 250, targetRotation: new Quat(), pointDensity: 3, seed: 99 });
                }
                const qMenu = Quat.fromAxisAngle([0, 1, 0], autoRotateTime).multiply(Quat.fromAxisAngle([1, 0, 0], Math.sin(autoRotateTime)*0.5));
                renderFrame(qMenu, Math.PI, 0.1, currentTime);
            }

            requestAnimationFrame(gameLoop);
        }

        document.getElementById('btn-start').addEventListener('click', () => startLevel(currentLevelIndex));
        document.getElementById('btn-levels').addEventListener('click', () => setScreen(GAME_STATES.LEVELS));
        document.getElementById('btn-levels-back').addEventListener('click', () => setScreen(GAME_STATES.MENU));
        document.getElementById('btn-back').addEventListener('click', () => setScreen(GAME_STATES.MENU));
        document.getElementById('btn-win-menu').addEventListener('click', () => setScreen(GAME_STATES.MENU));
        
        document.getElementById('btn-next').addEventListener('click', () => {
            startLevel(activeLevelIndex + 1);
        });
        
        document.getElementById('btn-final-menu').addEventListener('click', () => setScreen(GAME_STATES.MENU));

        if (localStorage.getItem('loveGameCompleted') === 'true') {
            currentLevelIndex = 100;
        }
        updateMenuTexts();
        setScreen(GAME_STATES.MENU);
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
