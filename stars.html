<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ulduz Xəritəsi | Cosmic Connect</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --sidebar-glass: rgba(15, 5, 30, 0.85);
            --z-bg: 0;
            --z-particles: 10;
            --z-halley: 40;
            --z-sidebar: 50;
            --z-submenu: 60;
            --z-map: 70;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Tam full-screen təcrübəsi */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        /* 1. Background Layers */
        #particle-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: var(--z-bg);
            background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%);
            pointer-events: none;
        }
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: var(--z-particles);
            pointer-events: none;
        }

        /* 2. Halley Button (Digər layihələrdəki ilə eyni standart css və ölçülər) */
        #halley-btn {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: env(safe-area-inset-left, 20px);
            z-index: var(--z-halley);
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(20, 5, 40, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            outline: none;
            /* Marginlər default ehtiyat üçün */
            margin-top: 15px; 
            margin-left: 15px;
        }
        #halley-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.5);
            background: rgba(30, 10, 60, 0.8);
        }
        #halley-btn svg.comet-icon {
            width: 24px;
            height: 24px;
        }

        /* 3. Sidebar System */
        #sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent;
            z-index: var(--z-sidebar);
            pointer-events: none;
            display: flex;
        }
        #sidebar-overlay.active {
            pointer-events: auto;
        }

        #sidebar {
            position: relative;
            width: 85vw;
            max-width: 400px;
            height: 100%;
            background: var(--sidebar-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }
        #sidebar.open {
            transform: translateX(0);
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            color: #d8b4fe;
            text-decoration: none;
            font-size: 1.1rem;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            background: transparent;
            border-top: none;
            border-right: none;
            border-bottom: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
        }
        .nav-link:hover {
            background: rgba(138, 43, 226, 0.15);
            color: #fff;
            border-left-color: rgba(216, 180, 254, 0.8);
        }
        .nav-link.active-menu {
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.2), transparent);
            color: #fff;
            border-left-color: #a855f7;
            font-weight: 500;
        }

        /* 4. Submenu (Sağa açılan popup panel) */
        #stars-submenu {
            position: fixed; /* getBoundingClientRect() ilə uyğunlaşmaq üçün */
            background: rgba(15, 5, 30, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 15px 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(138, 43, 226, 0.15);
            border-radius: 12px;
            padding: 8px;
            z-index: var(--z-submenu);
            /* Slide animasiyası (sağa doğru) */
            transform: translateX(-15px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 230px;
        }
        #stars-submenu.show {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
        }

        .submenu-item {
            padding: 12px 16px;
            color: rgba(216, 180, 254, 0.8);
            text-decoration: none;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .submenu-item:hover {
            background: rgba(138, 43, 226, 0.2);
            color: #fff;
        }
        .submenu-item .star-bullet {
            color: #a855f7;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }
        .submenu-item:hover .star-bullet {
            transform: scale(1.2);
            color: #d8b4fe;
        }

        /* 5. Map View Container */
        #map-view {
            position: fixed;
            inset: 0;
            z-index: var(--z-map);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #map-view.active {
            pointer-events: auto;
        }
        
        #map-backdrop {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 5, 30, 0.9) 0%, rgba(5, 1, 10, 0.98) 100%);
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #map-view.active #map-backdrop {
            opacity: 1;
        }

        /* Minimalist Yuxarı Başlıq */
        #map-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding-top: max(40px, env(safe-area-inset-top));
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.8s ease 0.2s;
            z-index: 10;
        }
        #map-view.active #map-header {
            opacity: 1;
            transform: translateY(0);
        }

        .minimalist-title {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin: 0;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .minimalist-subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(216, 180, 254, 0.6);
            text-transform: uppercase;
            font-size: clamp(0.6rem, 1.5vw, 0.75rem);
            margin-top: 8px;
        }

        /* Xəritənin Özü və Təbiiliyi Qoruyan Layout */
        #map-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s;
            margin-top: 60px; /* Başlıqdan aralı */
            width: 100%;
            height: 100%;
        }
        #map-view.active #map-content {
            opacity: 1;
            transform: scale(1);
        }

        #map-img {
            /* Şəklin orijinal formasını və ölçüsünü qoruyan tənzimləmə */
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 0; /* Aspect ratio pozulmasın */
            position: relative;
            z-index: 5;
            /* Box-shadow əvəzinə, PNG-nin daxili formasını (dairəvi və s.) qucaqlayan drop-shadow */
            filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.25));
        }

        /* Xəritə Ətrafındakı Kosmik Effektlər (Orbit, Glow) */
        .cosmic-halo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vw;
            max-width: 800px; max-height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 60%);
            animation: pulse-halo 4s ease-in-out infinite alternate;
            z-index: 1;
            pointer-events: none;
        }
        .orbit-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px dashed rgba(216, 180, 254, 0.2);
            z-index: 2;
            pointer-events: none;
            aspect-ratio: 1/1;
        }
        .ring-1 { width: 90vmin; height: 90vmin; max-width: 700px; max-height: 700px; animation: spin 50s linear infinite; }
        .ring-2 { width: 100vmin; height: 100vmin; max-width: 800px; max-height: 800px; border: 1px solid rgba(168, 85, 247, 0.1); animation: spin-reverse 70s linear infinite; }

        @keyframes pulse-halo {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

        /* Close Button */
        #btn-close-map {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 20;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            padding: 10px;
            line-height: 1;
        }
        #btn-close-map:hover {
            color: #fff;
            transform: scale(1.1) rotate(90deg);
        }
    </style>
</head>
<body>
    <!-- 1. Background Particles -->
    <div id="particle-bg"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- 2. Halley Button (Digər layihələrdəki ilə eyni SVG + Style) -->
    <button id="halley-btn" aria-label="Menu">
        <svg class="comet-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6" cy="18" r="2.5" fill="#d8b4fe" filter="drop-shadow(0 0 4px rgba(216,180,254,0.8))"/>
            <path d="M7.5 16.5L21 3" stroke="#d8b4fe" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M4.5 15.5L16 4" stroke="#d8b4fe" stroke-width="1" stroke-linecap="round"/>
            <path d="M8.5 19.5L19 9" stroke="#d8b4fe" stroke-width="1" stroke-linecap="round"/>
            <circle cx="2" cy="22" r="0.5" fill="#d8b4fe" />
            <circle cx="3.5" cy="20.5" r="1" fill="#d8b4fe" />
        </svg>
    </button>

    <!-- 3. Sidebar System -->
    <div id="sidebar-overlay">
        <div id="sidebar">
            <div class="flex items-center justify-between p-6 border-b border-purple-500/20">
                <h2 class="font-bold text-white text-lg tracking-widest text-shadow-sm" style="text-shadow: 0 0 10px rgba(168,85,247,0.8);">Kosmik Menyu</h2>
                <button id="btn-close-sidebar" class="text-purple-300 hover:text-white transition-colors p-2 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <nav class="flex-grow py-6 flex flex-col gap-2 relative">
                <a href="index.html" class="nav-link">
                    <div class="flex items-center gap-3"><span>💓</span> Kosmik Ürək</div>
                </a>
                <a href="game.html" class="nav-link">
                    <div class="flex items-center gap-3"><span>🎮</span> Sevgi Oyunu</div>
                </a>
                <a href="wheel.html" class="nav-link">
                    <div class="flex items-center gap-3"><span>🎡</span> Bu Gün Nə Edək?</div>
                </a>
                <a href="timer.html" class="nav-link">
                    <div class="flex items-center gap-3"><span>⏳</span> Zaman Sayğacı</div>
                </a>
                
                <!-- Ulduz Xəritəsi Parent Button -->
                <button id="btn-stars-parent" class="nav-link active-menu">
                    <div class="flex items-center gap-3"><span>✨</span> Ulduz Xəritəsi</div>
                    <svg id="stars-chevron" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <a href="songs.html" class="nav-link">
                    <div class="flex items-center gap-3"><span>🎵</span> Mahnılarımız</div>
                </a>
            </nav>
        </div>
    </div>

    <!-- 4. Right-side Floating Submenu (Mobil və Desktop üçün uyğunlaşdırılıb) -->
    <div id="stars-submenu">
        <a href="stars.html?person=haley" class="submenu-item" id="link-haley">
            <span class="star-bullet">✦</span> Haley Ulduz Xəritəsi
        </a>
        <a href="stars.html?person=rafo" class="submenu-item" id="link-rafo">
            <span class="star-bullet">✦</span> Rafo Ulduz Xəritəsi
        </a>
    </div>

    <!-- 5. Full-Screen Map View (No extra dashboards, just the cinematic view) -->
    <div id="map-view">
        <div id="map-backdrop"></div>
        <button id="btn-close-map" aria-label="Close Map">&times;</button>
        
        <!-- Yuxarıda mərkəzləşdirilmiş minimalist başlıq -->
        <div id="map-header">
            <h1 id="map-title" class="minimalist-title"></h1>
            <div id="map-subtitle" class="minimalist-subtitle">ULDUZ XƏRİTƏSİ</div>
        </div>
        
        <div id="map-content">
            <!-- Arxa plan effektləri qorunub -->
            <div class="cosmic-halo" id="map-halo"></div>
            <div class="orbit-ring ring-1"></div>
            <div class="orbit-ring ring-2">
                <div class="absolute top-0 left-1/2 w-1 h-1 bg-white rounded-full shadow-[0_0_5px_white]"></div>
            </div>
            
            <!-- src atributu ilkin olaraq yoxdur -->
            <img id="map-img" alt="Star Map">
        </div>
    </div>

    <script>
        /* 1. Dataset (Məlumatlar toxunulmaz qalıb) */
        const STAR_MAPS = {
            haley: {
                name: "HALEY",
                image: "assets/Haley.png",
                glowColor: "rgba(168, 85, 247, 0.2)",
                date: "", time: "", location: ""
            },
            rafo: {
                name: "RAFO",
                image: "assets/Rafo.png",
                glowColor: "rgba(107, 33, 168, 0.25)",
                date: "", time: "", location: ""
            }
        };

        /* 2. Background Particles */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        function initParticles() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            const numParticles = width < 768 ? 50 : 100;
            for(let i=0; i<numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.0 + 0.2,
                    alpha: Math.random() * 0.5 + 0.1,
                    pulse: Math.random() * 0.005 + 0.002,
                    dir: Math.random() > 0.5 ? 1 : -1,
                    vy: Math.random() * 0.1
                });
            }
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.alpha += p.pulse * p.dir;
                if(p.alpha >= 0.6) { p.alpha = 0.6; p.dir = -1; }
                else if(p.alpha <= 0.1) { p.alpha = 0.1; p.dir = 1; }
                
                p.y -= p.vy;
                if(p.y < 0) p.y = height;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        
        window.addEventListener('resize', initParticles);
        initParticles();
        animateParticles();

        /* 3. UI Elementləri və Məntiqlər */
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const btnHalley = document.getElementById('halley-btn');
        const btnCloseSidebar = document.getElementById('btn-close-sidebar');
        
        const btnStarsParent = document.getElementById('btn-stars-parent');
        const starsChevron = document.getElementById('stars-chevron');
        const starsSubmenu = document.getElementById('stars-submenu');
        
        const mapView = document.getElementById('map-view');
        const mapImg = document.getElementById('map-img');
        const mapTitle = document.getElementById('map-title');
        const mapHalo = document.getElementById('map-halo');
        const btnCloseMap = document.getElementById('btn-close-map');

        // Sidebar Open/Close
        function openSidebar() {
            overlay.classList.add('active');
            sidebar.classList.add('open');
        }
        
        function closeSidebar() {
            overlay.classList.remove('active');
            sidebar.classList.remove('open');
            hideSubmenu();
        }

        btnHalley.addEventListener('click', openSidebar);
        btnCloseSidebar.addEventListener('click', closeSidebar);

        // Submenu (Həmişə parent-in sağından çıxır)
        btnStarsParent.addEventListener('click', (e) => {
            e.preventDefault();
            const isShown = starsSubmenu.classList.contains('show');
            if (isShown) {
                hideSubmenu();
            } else {
                showSubmenu();
            }
        });

        function showSubmenu() {
            const rect = btnStarsParent.getBoundingClientRect();
            
            // İlkin olaraq sağa açılmasını hədəfləyirik
            let leftPos = rect.right + 10;
            let topPos = rect.top;
            
            // Submenu-nun təxmini və ya real genişliyi
            const submenuWidth = starsSubmenu.offsetWidth || 230;

            // Ekrandan daşarsa (xüsusən Mobil ekranlarda),
            // Submenu-nu ekranın sağ kənarına dayayırıq, beləliklə sidebar-ın üzərində olsa da
            // Y-oxu üzrə yenə də buttonla eyni səviyyədə, yəni "yandan gələn popup" kimi qalır.
            if (leftPos + submenuWidth > window.innerWidth) {
                leftPos = window.innerWidth - submenuWidth - 15;
            }

            starsSubmenu.style.top = `${topPos}px`;
            starsSubmenu.style.left = `${leftPos}px`;
            
            starsSubmenu.classList.add('show');
            starsChevron.style.transform = 'rotate(-90deg)';
        }

        function hideSubmenu() {
            starsSubmenu.classList.remove('show');
            starsChevron.style.transform = 'rotate(0deg)';
        }

        /* 4. Full-Screen Map Məntiqi */
        function openMap(personId) {
            const data = STAR_MAPS[personId];
            if(!data) return;

            closeSidebar();
            
            // Datanı doldur
            mapImg.src = data.image;
            mapTitle.textContent = data.name; 
            mapHalo.style.background = `radial-gradient(circle, ${data.glowColor} 0%, transparent 60%)`;
            
            // Xəritəni Cinematic şəkildə aç
            mapView.classList.add('active');
            
            // URL-i səssizcə yenilə (Try-Catch ilə təhlükəsizlik)
            try {
                const url = new URL(window.location);
                url.searchParams.set('person', personId);
                window.history.pushState({}, '', url);
            } catch (error) {
                console.warn("URL pushState bloklandı, lakin tətbiq normal işləyir.");
            }
        }

        function closeMap() {
            mapView.classList.remove('active');
            
            // Animasiyanın (0.9s) bitməsini gözləyirik, sonra isə `src`-ni TƏMİZLƏYİRİK
            setTimeout(() => {
                mapImg.removeAttribute('src');
            }, 900); 

            try {
                const url = new URL(window.location);
                url.searchParams.delete('person');
                window.history.pushState({}, '', url);
            } catch (error) {
                console.warn("URL history təmizləmək bloklandı.");
            }
        }

        btnCloseMap.addEventListener('click', closeMap);

        // Submenu linklərinə müdaxilə
        document.getElementById('link-haley').addEventListener('click', (e) => {
            e.preventDefault();
            openMap('haley');
        });
        document.getElementById('link-rafo').addEventListener('click', (e) => {
            e.preventDefault();
            openMap('rafo');
        });

        // Səhifə yüklənəndə query parametri yoxla
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const person = params.get('person');
            if(person && STAR_MAPS[person]) {
                // Əgər spesifik xəritə istənilibsə, qısa gecikmə ilə aç (background animations render olması üçün)
                setTimeout(() => openMap(person), 100);
            }
        });
    </script>
</body>
</html>
