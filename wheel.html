<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bu Gün Nə Edək? | Cosmic Decision Wheel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cosmic-bg: #070311;
            --purple-glow: rgba(138, 43, 226, 0.5);
            --lavender: #d8b4fe;
            --dark-glass: rgba(20, 10, 40, 0.65);
            --sidebar-glass: rgba(15, 5, 30, 0.85);
            --z-bg: 0;
            --z-particles: 10;
            --z-wheel: 20;
            --z-ui: 30;
            --z-halley: 40;
            --z-sidebar: 50;
        }

        body {
            background-color: var(--cosmic-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .cinzel { font-family: 'Cinzel', serif; }

        /* Background Layers */
        #particle-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: var(--z-bg);
            background: radial-gradient(circle at center, #0f051c 0%, #05010a 100%);
            pointer-events: none;
        }
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: var(--z-particles);
            pointer-events: none;
        }
        #burst-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 25; 
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--dark-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.15);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(216, 180, 254, 0.7);
        }

        /* Wheel Container */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            z-index: var(--z-wheel);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-container {
            position: relative;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.9);
            border: 5px solid rgba(138, 43, 226, 0.5);
            background: #0d041a;
        }

        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .wheel-center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12%;
            height: 12%;
            background: radial-gradient(circle, #3b176b 0%, #110524 100%);
            border-radius: 50%;
            border: 2px solid rgba(216, 180, 254, 0.7);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.9);
            z-index: 10;
        }

        /* Pointer */
        .wheel-pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 45px;
            background: linear-gradient(to bottom, #f3e8ff, #9333ea);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 0 12px rgba(216, 180, 254, 1));
            animation: float-pointer 2s ease-in-out infinite;
        }

        @keyframes float-pointer {
            0%, 100% { transform: translateX(-50%) translateY(0); filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8)); }
            50% { transform: translateX(-50%) translateY(-3px); filter: drop-shadow(0 0 18px rgba(216, 180, 254, 1)); }
        }

        /* Main Spin Button */
        .btn-spin {
            background: linear-gradient(135deg, rgba(107, 33, 168, 0.8), rgba(59, 7, 100, 0.9));
            border: 1px solid rgba(216, 180, 254, 0.5);
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-spin::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7);
            border-color: rgba(216, 180, 254, 0.9);
        }
        .btn-spin:hover:not(:disabled)::before { left: 100%; }
        .btn-spin:active:not(:disabled) { transform: translateY(1px); }
        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
            box-shadow: none;
        }

        /* UI Results & Overlays */
        #result-overlay { z-index: var(--z-ui); }
        
        .modal-enter {
            animation: modalFadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalFadeInScale {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .btn-secondary {
            background: rgba(30, 10, 60, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.4);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: rgba(50, 15, 90, 0.8);
            border-color: rgba(216, 180, 254, 0.6);
        }
        
        /* Extra visuals for special activities */
        #extra-visuals:empty {
            display: none;
        }

        /* Sidebar System */
        #sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent; 
            z-index: var(--z-sidebar);
            pointer-events: none; 
            display: flex;
        }
        #sidebar-overlay.active {
            pointer-events: auto; 
        }

        #sidebar {
            position: relative;
            width: 85vw;
            max-width: 400px;
            height: 100%;
            background: var(--sidebar-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: auto; 
            display: flex;
            flex-direction: column;
        }
        #sidebar.open {
            transform: translateX(0);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            color: #d8b4fe;
            text-decoration: none;
            font-size: 1.1rem;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(138, 43, 226, 0.15);
            color: #fff;
            border-left-color: rgba(216, 180, 254, 0.8);
        }
        .nav-link.active {
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.2), transparent);
            color: #fff;
            border-left-color: #a855f7;
            font-weight: 600;
        }

        /* Halley Button */
        #halley-btn {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: env(safe-area-inset-left, 20px);
            z-index: var(--z-halley);
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(20, 5, 40, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        #halley-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.5);
            background: rgba(30, 10, 60, 0.8);
        }

        /* History Minimal List */
        .history-item {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    </style>

    <script>
        /* -----------------------------------------------------------
           1. Sidebar Manager (Strict Rules)
        ----------------------------------------------------------- */
        const SidebarManager = {
            init: function() {
                this.overlay = document.getElementById('sidebar-overlay');
                this.sidebar = document.getElementById('sidebar');
                this.btnHalley = document.getElementById('halley-btn');
                this.btnClose = document.getElementById('btn-close-sidebar');
                this.navContainer = document.getElementById('sidebar-nav');
                
                this.isOpen = false;
                this.buildNav();
                this.bindEvents();
            },

            buildNav: function() {
                const links = [
                    { name: '💓 Kosmik Ürək', url: APP_CONFIG.mainSiteUrl, active: false },
                    { name: '🎮 Sevgi Oyunu', url: APP_CONFIG.loveGameUrl, active: false },
                    { name: '🎡 Bu Gün Nə Edək?', url: APP_CONFIG.todayChoiceUrl, active: true },
                    { name: '⏳ Zaman Sayğacı', url: APP_CONFIG.timerUrl, active: false },
                    { name: '✨ Ulduz Xəritəsi', url: APP_CONFIG.starsUrl, active: false },
                    { name: '🎵 Mahnılarımız', url: APP_CONFIG.songsUrl, active: false }
                ];

                links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.className = `nav-link ${link.active ? 'active' : ''}`;
                    a.textContent = link.name;
                    this.navContainer.appendChild(a);
                });
            },

            bindEvents: function() {
                this.btnHalley.addEventListener('click', () => this.toggle());
                this.btnClose.addEventListener('click', () => this.close());
            },

            toggle: function() {
                this.isOpen ? this.close() : this.open();
            },

            open: function() {
                this.isOpen = true;
                this.overlay.classList.add('active');
                this.sidebar.classList.add('open');
            },

            close: function() {
                this.isOpen = false;
                this.overlay.classList.remove('active');
                this.sidebar.classList.remove('open');
            }
        };

        /* -----------------------------------------------------------
           2. Background Particle System
        ----------------------------------------------------------- */
        class BackgroundParticles {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.numParticles = window.innerWidth < 768 ? 60 : 150;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.initParticles();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.numParticles; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 1.2 + 0.2,
                        vx: (Math.random() - 0.5) * 0.15,
                        vy: (Math.random() - 0.5) * 0.15,
                        alpha: Math.random() * 0.5 + 0.1,
                        pulseDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    p.alpha += 0.005 * p.pulseDir;
                    if (p.alpha > 0.7) { p.alpha = 0.7; p.pulseDir = -1; }
                    if (p.alpha < 0.1) { p.alpha = 0.1; p.pulseDir = 1; }

                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`;
                    this.ctx.fill();
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        /* -----------------------------------------------------------
           3. Wheel Particles (Burst Effect on Stop)
        ----------------------------------------------------------- */
        class BurstParticles {
            constructor() {
                this.canvas = document.getElementById('burst-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animating = false;
            }
            
            resize(w, h) {
                this.canvas.width = w;
                this.canvas.height = h;
            }

            trigger(x, y) {
                this.particles = [];
                for(let i=0; i<30; i++){
                    const angle = (Math.random() * Math.PI) + Math.PI; 
                    const speed = Math.random() * 3 + 1;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 2 + 1,
                        alpha: 1,
                        life: Math.random() * 0.02 + 0.01 
                    });
                }
                if(!this.animating){
                    this.animating = true;
                    this.animate();
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                let alive = false;

                this.particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= p.life;
                        
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(216, 180, 254, ${Math.max(0, p.alpha)})`;
                        this.ctx.fill();
                        
                        this.ctx.shadowBlur = 5;
                        this.ctx.shadowColor = '#d8b4fe';
                    }
                });

                if (alive) {
                    requestAnimationFrame(() => this.animate());
                } else {
                    this.animating = false;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        }

        /* -----------------------------------------------------------
           4. History Storage
        ----------------------------------------------------------- */
        const StorageManager = {
            KEY: 'cosmic_wheel_recent',
            get: function() {
                try { return JSON.parse(localStorage.getItem(this.KEY)) || []; }
                catch(e) { return []; }
            },
            add: function(title) {
                let list = this.get();
                if (list[0] !== title) {
                    list.unshift(title);
                    if (list.length > 5) list = list.slice(0, 5);
                    localStorage.setItem(this.KEY, JSON.stringify(list));
                }
            },
            render: function(containerId) {
                const container = document.getElementById(containerId);
                const list = this.get();
                container.innerHTML = '';
                
                if (list.length === 0) {
                    container.innerHTML = '<span class="text-xs text-purple-500/50">Hələ heç nə seçilməyib</span>';
                    return;
                }

                list.slice(0, 3).forEach((title, idx) => {
                    const span = document.createElement('span');
                    span.className = `history-item text-[11px] px-2 py-1 bg-purple-900/30 border border-purple-500/20 rounded-full text-purple-300`;
                    span.style.animationDelay = `${idx * 0.1}s`;
                    span.textContent = title;
                    container.appendChild(span);
                });
            }
        };

        /* -----------------------------------------------------------
           5. Main Application & Wheel Logic
        ----------------------------------------------------------- */
        class TodayChoiceApp {
            constructor() {
                this.items = ACTIVITIES;
                this.numSegments = this.items.length;
                this.isSpinning = false;
                this.currentRotation = 0;
                this.lastSelectedIndex = -1;
                this.highlightedIndex = -1;

                this.colors = ['#1a0b2e', '#230f3f', '#120524']; 

                this.wheelCanvas = document.getElementById('wheel-canvas');
                this.ctx = this.wheelCanvas.getContext('2d', { alpha: true });
                this.spinBtn = document.getElementById('spin-btn');
                
                this.resultOverlay = document.getElementById('result-overlay');
                this.resultCard = document.getElementById('result-card');
                this.resultTitle = document.getElementById('result-title');
                this.resultDesc = document.getElementById('result-desc');
                this.btnCloseResult = document.getElementById('btn-close-result');
                this.btnSpinAgain = document.getElementById('btn-spin-again');
                
                this.burstSystem = new BurstParticles();

                this.init();
            }

            init() {
                SidebarManager.init();
                new BackgroundParticles();
                StorageManager.render('history-list');
                
                this.setupCanvas();
                window.addEventListener('resize', () => {
                    this.setupCanvas();
                    this.drawWheel();
                });
                this.drawWheel();

                this.bindEvents();
            }

            setupCanvas() {
                const size = 1200; 
                this.wheelCanvas.width = size;
                this.wheelCanvas.height = size;
                this.centerX = size / 2;
                this.centerY = size / 2;
                this.radius = size / 2 - 20;

                const rect = this.wheelCanvas.getBoundingClientRect();
                this.burstSystem.resize(rect.width, rect.height);
            }

            drawWheel() {
                const { ctx, centerX, centerY, radius, numSegments, items, colors } = this;
                ctx.clearRect(0, 0, this.wheelCanvas.width, this.wheelCanvas.height);

                const arc = (Math.PI * 2) / numSegments;

                ctx.lineWidth = 2;
                
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc - (Math.PI / 2); 
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, angle, angle + arc);
                    ctx.lineTo(centerX, centerY);
                    
                    if (this.highlightedIndex === i) {
                        ctx.fillStyle = '#4c1d95'; 
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = '#d8b4fe';
                    } else {
                        ctx.fillStyle = colors[i % colors.length];
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
                    ctx.stroke(); 
                    
                    ctx.shadowBlur = 0; 

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle + arc / 2);
                    
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    
                    const text = items[i].title;
                    let fontSize = 24; 
                    if(text.length > 25) fontSize = 18;
                    if(text.length > 35) fontSize = 14;

                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(233, 213, 255, 0.85)";
                    ctx.font = `600 ${fontSize}px 'Inter', sans-serif`;
                    
                    ctx.fillText(text, radius - 30, 0, radius - 150); 
                    
                    ctx.beginPath();
                    ctx.arc(radius - 12, 0, 3, 0, Math.PI * 2);
                    ctx.fillStyle = (this.highlightedIndex === i) ? "#ffffff" : "rgba(168, 85, 247, 0.6)";
                    ctx.fill();

                    ctx.restore();
                }
            }

            bindEvents() {
                this.spinBtn.addEventListener('click', () => this.spin());
                this.btnSpinAgain.addEventListener('click', () => {
                    this.closeResult();
                    setTimeout(() => this.spin(), 300);
                });
                this.btnCloseResult.addEventListener('click', () => this.closeResult());
                
                this.wheelCanvas.addEventListener('transitionend', () => this.onSpinComplete());
            }

            spin() {
                if (this.isSpinning) return;
                this.isSpinning = true;
                this.spinBtn.disabled = true;
                this.highlightedIndex = -1; 
                this.drawWheel(); 

                let availableIndices = this.items.map((_, i) => i).filter(i => i !== this.lastSelectedIndex);
                if (availableIndices.length === 0) availableIndices = [0];
                
                const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                this.lastSelectedIndex = targetIndex;
                this.currentSelectedActivity = this.items[targetIndex];
                
                const segmentAngle = 360 / this.numSegments;
                const targetAngleRel = 360 - (targetIndex * segmentAngle);
                
                const currentMod = this.currentRotation % 360;
                let rotateBy = targetAngleRel - currentMod;
                
                const extraSpins = (Math.floor(Math.random() * 4) + 5) * 360; 
                this.currentRotation += (extraSpins + rotateBy);

                const duration = (Math.random() * 3 + 4).toFixed(2);
                
                this.wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.95, 0.25, 1)`;
                this.wheelCanvas.style.transform = `rotate(${this.currentRotation}deg)`;
            }

            onSpinComplete() {
                if (!this.isSpinning) return;
                this.isSpinning = false;
                
                this.highlightedIndex = this.lastSelectedIndex;
                this.drawWheel();
                
                const rect = document.getElementById('burst-canvas').getBoundingClientRect();
                this.burstSystem.trigger(rect.width / 2, 20);

                StorageManager.add(this.currentSelectedActivity.title);
                StorageManager.render('history-list');

                setTimeout(() => this.showResult(this.currentSelectedActivity), 600);
            }

            showResult(activity) {
                this.resultTitle.textContent = activity.title;
                this.resultDesc.textContent = activity.desc;
                
                const extraVisuals = document.getElementById('extra-visuals');
                if (extraVisuals) {
                    extraVisuals.innerHTML = '';
                    if (activity.id === 3) {
                        extraVisuals.innerHTML = `
                            <div class="flex justify-center items-center gap-2 sm:gap-3 text-purple-300 text-[10px] sm:text-xs font-bold tracking-[0.2em] uppercase">
                                <span>24 ANI</span>
                                <span class="w-1.5 h-1.5 rounded-full bg-purple-500/50"></span>
                                <span>24 FOTO</span>
                                <span class="w-1.5 h-1.5 rounded-full bg-purple-500/50"></span>
                                <span>24 SAAT</span>
                            </div>
                        `;
                    }
                }

                this.resultOverlay.classList.remove('hidden');
                this.resultOverlay.classList.add('flex');
                
                this.resultCard.classList.remove('modal-enter');
                void this.resultCard.offsetWidth; 
                this.resultCard.classList.add('modal-enter');
            }

            closeResult() {
                this.resultOverlay.classList.add('hidden');
                this.resultOverlay.classList.remove('flex');
                this.spinBtn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TodayChoiceApp();
        });
    </script>
